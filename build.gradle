plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
}

sourceSets {
    main {
        java.setSrcDirs(['arrival/src/main/java'])
        resources.setSrcDirs(['arrival/src/main/resources'])
    }
}

repositories {
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Compile against the exact Photon 1.20.1 Forge release the pack is using.
    compileOnly fg.deobf("curse.maven:photon-871522:7501597")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar).configure {
    // Kept at the filename expected by the existing CI uploader on this isolated build branch.
    archiveFileName = "CyberNpc-0.34.0-forge-1.20.1.jar"

    manifest {
        attributes([
                'Specification-Title'     : 'season2arrival',
                'Specification-Vendor'    : 'Cyberspectraa',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'Season 2 Arrival',
                'Implementation-Version'  : '0.2.0',
                'Implementation-Vendor'   : 'Cyberspectraa',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Photon 1.x FX is serialized once during the build; the exported effect is
// packaged inside CyberNpc.jar. Normal gameplay code uses only the server
// command, not client-only Photon classes.
sourceSets {
    fxgen {
        java.srcDir 'fxgen/src/main/java'
        resources.srcDirs = []
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'LowDragLibSnapshots'
        url = 'https://maven.firstdarkdev.xyz/snapshots'
        content { includeGroup 'com.lowdragmc.ldlib' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Pinned Photon and LDLib Forge 1.20.1 API for the build-time FX exporter.
    fxgenImplementation fg.deobf("curse.maven:photon-871522:7501597@jar")
    fxgenImplementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.42@jar")
}

tasks.register('generateIslandRiftFx', JavaExec) {
    dependsOn tasks.named('fxgenClasses')
    classpath = sourceSets.fxgen.runtimeClasspath
    mainClass = 'com.cyberspectraa.cybernpc.fxgen.IslandRiftFxGenerator'
    args layout.buildDirectory.file('generated-island-rift/assets/cybernpc/fx/island_rift.fx')
            .get().asFile.absolutePath
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateIslandRiftFx')
    from(layout.buildDirectory.dir('generated-island-rift'))
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "CyberNpc-${mod_version}-forge-${minecraft_version}.jar"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
